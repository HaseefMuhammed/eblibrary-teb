<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123b73">
    <meta name="description" content="Install EDU BOT Attendance System on your device for a full-screen attendance experience.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Install EDU BOT Attendance System</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172b4d;
            background: #f2f6fc;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 280px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            background: radial-gradient(circle at top, #dceaff 0, #f2f6fc 55%);
        }

        main {
            width: min(100%, 460px);
            padding: clamp(28px, 8vw, 48px);
            text-align: center;
            background: #fff;
            border: 1px solid #e2eaf5;
            border-radius: 24px;
            box-shadow: 0 22px 60px rgb(18 59 115 / 12%);
        }

        .app-icon {
            width: 104px;
            height: 104px;
            margin-bottom: 20px;
            object-fit: contain;
            border-radius: 22px;
        }

        h1 {
            margin: 0;
            color: #123b73;
            font-size: clamp(1.55rem, 6vw, 2rem);
            line-height: 1.2;
        }

        p {
            margin: 14px 0 24px;
            color: #53657f;
            line-height: 1.6;
        }

        button, .open-app {
            width: 100%;
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        #installButton {
            color: #fff;
            background: #1559a6;
            box-shadow: 0 8px 18px rgb(21 89 166 / 22%);
        }

        #installButton:hover { background: #104985; }
        #installButton:focus-visible, .open-app:focus-visible { outline: 3px solid #f2b544; outline-offset: 3px; }

        .open-app {
            min-height: 44px;
            margin-top: 10px;
            color: #1559a6;
            background: transparent;
        }

        #installStatus {
            min-height: 1.5em;
            margin: 14px 0 0;
            font-size: .9rem;
        }

        @media (max-width: 360px) {
            body { padding-right: 14px; padding-left: 14px; }
            main { padding: 26px 20px; }
        }
    </style>
</head>
<body>
    <main>
        <img class="app-icon" src="icon.png" alt="EDU BOT Attendance System icon">
        <h1>EDU BOT Attendance System</h1>
        <p>Install the app on your device for quick access and a focused, full-screen attendance experience. The app supports both portrait and landscape orientations.</p>
        <button id="installButton" type="button">
            <span aria-hidden="true">⬇</span>
            <span>Install EDU BOT Attendance System</span>
        </button>
        <a class="open-app" href="app.html">Open Attendance App</a>
        <p id="installStatus" role="status" aria-live="polite"></p>
    </main>
    <script src="pwa.js" defer></script>
</body>
</html>
